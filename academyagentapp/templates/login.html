<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar matching the chat interface */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-[#1e1f22] text-[#f3f4f6] font-sans min-h-screen flex items-center justify-center p-4">

    <!-- MAIN AUTH CARD CONTAINER -->
    <div class="w-full max-w-md bg-[#121212] border border-gray-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Header & Logo -->
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-400 via-indigo-500 to-purple-500 flex items-center justify-center text-2xl text-white mb-3 shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-gray-100">Welcome to Nexus AI</h1>
            <p class="text-gray-400 text-xs mt-1">Sign in or create an account to continue</p>
        </div>

        <!-- TAB SWITCHER (Login / Signup) -->
        <div class="flex bg-[#1e1f22] p-1 rounded-xl mb-6 border border-gray-800">
            <button id="login-tab-btn" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 bg-[#2b2c30] text-white shadow">
                Log In
            </button>
            <button id="signup-tab-btn" onclick="switchTab('signup')" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 text-gray-400 hover:text-white">
                Sign Up
            </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="login-form" onsubmit="handleAuth(event, 'login')" class="space-y-4" action="" method="POST">
            <!-- Username Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Username or Email</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="text" name="username" required placeholder="developer_john" class="w-full bg-[#1e1f22] border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-gray-500 transition-colors">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                    <a href="#" class="text-xs text-indigo-400 hover:underline">Forgot?</a>
                </div>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="password" name="password" id="login-password" required placeholder="••••••••" class="w-full bg-[#1e1f22] border border-gray-800 rounded-xl pl-10 pr-10 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-gray-500 transition-colors">
                    <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute right-3.5 top-3 text-gray-500 hover:text-gray-300">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:opacity-90 text-white font-medium text-sm py-3 rounded-xl shadow-lg transition duration-200 mt-2 flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- SIGNUP FORM (Hidden by default) -->  
        <form id="signup-form" onsubmit="handleAuth(event, 'signup')" class="space-y-4 hidden" action="" method="POST">
            <!-- Username Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="text" name="username" required placeholder="developer_john" class="w-full bg-[#1e1f22] border border-gray-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-gray-500 transition-colors">
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="password" name="password" id="signup-password" required placeholder="Create a strong password" class="w-full bg-[#1e1f22] border border-gray-800 rounded-xl pl-10 pr-10 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-gray-500 transition-colors">
                    <button type="button" onclick="togglePasswordVisibility('signup-password', this)" class="absolute right-3.5 top-3 text-gray-500 hover:text-gray-300">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password Input -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Confirm Password</label>
                <div class="relative">
                    <i class="fa-solid fa-shield-halved absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
                    <input type="password" name="password_confirm" id="signup-confirm-password" required placeholder="Repeat password" class="w-full bg-[#1e1f22] border border-gray-800 rounded-xl pl-10 pr-10 py-2.5 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-gray-500 transition-colors">
                    <button type="button" onclick="togglePasswordVisibility('signup-confirm-password', this)" class="absolute right-3.5 top-3 text-gray-500 hover:text-gray-300">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 hover:opacity-90 text-white font-medium text-sm py-3 rounded-xl shadow-lg transition duration-200 mt-2 flex items-center justify-center gap-2">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus text-xs"></i>
            </button>
        </form>

        <!-- DIVIDER -->
        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
            <div class="relative flex justify-center text-[10px] uppercase tracking-wider"><span class="bg-[#121212] px-3 text-gray-500 font-semibold">Or continue with</span></div>
        </div>

        <!-- SOCIAL LOGINS -->
        <div class="grid grid-cols-2 gap-3">
            <button type="button" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#1e1f22] border border-gray-800 rounded-xl text-xs font-medium text-gray-300 hover:bg-[#2b2c30] hover:text-white transition-colors">
                <i class="fa-brands fa-google text-sm"></i> Google
            </button>
            <button type="button" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-[#1e1f22] border border-gray-800 rounded-xl text-xs font-medium text-gray-300 hover:bg-[#2b2c30] hover:text-white transition-colors">
                <i class="fa-brands fa-github text-sm"></i> GitHub
            </button>
        </div>

        <!-- FOOTER DISCLOSURE -->
        <p class="text-center text-[10px] text-gray-500 mt-6">
            By continuing, you agree to Nexus AI's <a href="#" class="underline hover:text-gray-400">Terms of Service</a> & <a href="#" class="underline hover:text-gray-400">Privacy Policy</a>.
        </p>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Switch between Login and Sign Up views
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginBtn = document.getElementById('login-tab-btn');
            const signupBtn = document.getElementById('signup-tab-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                
                // Active state for Login tab
                loginBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 bg-[#2b2c30] text-white shadow";
                signupBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 text-gray-400 hover:text-white";
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                
                // Active state for Signup tab
                signupBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 bg-[#2b2c30] text-white shadow";
                loginBtn.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all duration-200 text-gray-400 hover:text-white";
            }
        }

        // Toggle password visibility (show/hide text)
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash text-sm text-indigo-400';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye text-sm text-gray-500';
            }
        }

        // Form submission handler mockup
        function handleAuth(event, mode) {
            event.preventDefault();
            // Connect this to your backend auth API or Firebase/Supabase logic
            alert(`Simulated ${mode === 'login' ? 'Log In' : 'Sign Up'} successful! Redirecting to chat...`);

            let login_mode = document.createElement('input');
            login_mode.type = 'hidden';
            login_mode.name = 'login_mode';
            login_mode.value = mode;
            event.target.appendChild(login_mode);
            
            console.log(`TARGET ${event.target}`);
            event.target.submit();
            return true;
        }
    </script>
</body>
</html>
